[project]
name = "tensdireito-content-engine"
version = "0.1.0"
description = "Editorial Intelligence Engine para o TensDireito.com."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
]

[project.scripts]
tde = "tensdireito_content_engine.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
