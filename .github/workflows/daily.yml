name: Daily pipeline

on:
  schedule:
    - cron: '0 8,13,18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install project
        run: uv sync --locked

      - name: Run daily pipeline
        shell: bash
        run: |
          set +e
          uv run tde daily
          status=$?
          set -e

          case "$status" in
            0)
              echo "Daily pipeline completed successfully."
              ;;
            1)
              echo "::error::Daily pipeline failed with a fatal error."
              exit 1
              ;;
            2)
              {
                echo "## Daily pipeline completed with partial failures"
                echo
                echo "> **Warning:** Some sources could not be collected. The daily report may be incomplete."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Daily pipeline returned unexpected exit code $status."
              exit "$status"
              ;;
          esac

      - name: Sync unverified drafts to GitHub Issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run tde drafts sync-issues
