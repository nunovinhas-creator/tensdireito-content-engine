name: Daily pipeline

# Três execuções diárias (DEC-050): 08:00, 13:00 e 18:00 UTC.
# O runner continua efémero (D8 OPEN): o SQLite não persiste entre execuções.
# A deduplicação entre execuções é feita pelas issues (referência ao URL da fonte).
on:
  schedule:
    - cron: "0 8,13,18 * * *"
  workflow_dispatch:

# Evita duas execuções em simultâneo a criar issues duplicadas; não cancela a que está a correr.
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  daily:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install project
        run: uv sync --locked

      - name: Validate configured sources
        run: uv run tde sources validate

      - name: Run daily pipeline
        shell: bash
        env:
          # DEC-059: opcional; sem o secret, os rascunhos usam só regras.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          uv run tde daily --summary-md "$GITHUB_STEP_SUMMARY"
          status=$?
          set -e

          case "$status" in
            0)
              echo "Daily pipeline completed successfully."
              ;;
            1)
              echo "::error::Daily pipeline failed with a fatal error."
              exit 1
              ;;
            2)
              {
                echo "## Daily pipeline completed with partial failures"
                echo
                echo "> **Warning:** Some sources could not be collected. The daily report may be incomplete."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Daily pipeline returned unexpected exit code $status."
              exit "$status"
              ;;
          esac

      - name: Sync unverified drafts to GitHub Issues
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          uv run tde drafts sync-issues | tee sync.txt
          {
            echo "### Issues"
            echo
            sed 's/^/- /; s/^- - /  - /' sync.txt
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # DEC-058: só interessam notícias do dia; rascunhos com mais de 3 dias são fechados.
      - name: Close stale draft issues
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          uv run tde drafts close-stale --days 3 | tee close.txt
          sed 's/^/- /; s/^- - /  - /' close.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve daily report as workflow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tensdireito-daily-report-${{ github.run_id }}
          path: data/reports/daily/*.txt
          if-no-files-found: warn
          retention-days: 14
