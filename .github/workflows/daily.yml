name: Daily pipeline

# Três execuções diárias (DEC-050): 08:00, 13:00 e 18:00 UTC.
# O runner continua efémero (D8 OPEN): o SQLite não persiste entre execuções.
# A deduplicação entre execuções é feita pelas issues (referência ao URL da fonte).
on:
  schedule:
    - cron: "0 8,13,18 * * *"
  workflow_dispatch:

# Evita duas execuções em simultâneo a criar issues duplicadas; não cancela a que está a correr.
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  daily:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install project
        run: uv sync --locked

      - name: Validate configured sources
        run: uv run tde sources validate

      - name: Run daily pipeline
        shell: bash
        run: |
          set +e
          uv run tde daily
          status=$?
          set -e

          case "$status" in
            0)
              echo "Daily pipeline completed successfully."
              ;;
            1)
              echo "::error::Daily pipeline failed with a fatal error."
              exit 1
              ;;
            2)
              {
                echo "## Daily pipeline completed with partial failures"
                echo
                echo "> **Warning:** Some sources could not be collected. The daily report may be incomplete."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Daily pipeline returned unexpected exit code $status."
              exit "$status"
              ;;
          esac

      - name: Sync unverified drafts to GitHub Issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run tde drafts sync-issues

      - name: Preserve daily report as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tensdireito-daily-report-${{ github.run_id }}
          path: data/reports/daily/*.txt
          if-no-files-found: warn
          retention-days: 14
