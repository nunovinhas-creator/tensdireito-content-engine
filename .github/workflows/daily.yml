name: Daily pipeline

# Três execuções diárias (DEC-050): 08:07, 13:07 e 18:07 UTC (minuto 7: DEC-061).
# DEC-061: o SQLite passa entre execuções pelo cache do GitHub Actions (grátis). Se o
# cache se perder, a base recomeça vazia; a deduplicação pelas issues continua a valer.
on:
  schedule:
    - cron: "7 8,13,18 * * *"
  workflow_dispatch:

# Evita duas execuções em simultâneo a criar issues duplicadas; não cancela a que está a correr.
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  daily:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install project
        run: uv sync --locked

      - name: Restore database
        uses: actions/cache/restore@v6
        with:
          path: data/tde.sqlite3
          key: tde-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tde-db-

      - name: Validate configured sources
        run: uv run tde sources validate

      - name: Check AI provider
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        shell: bash
        run: |
          uv run tde llm check | tee llm.txt
          sed 's/^/- /' llm.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Run daily pipeline
        shell: bash
        env:
          # DEC-062: redacção com IA (planos gratuitos); sem chaves, só regras.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set +e
          uv run tde daily --summary-md "$GITHUB_STEP_SUMMARY"
          status=$?
          set -e

          case "$status" in
            0)
              echo "Daily pipeline completed successfully."
              ;;
            1)
              echo "::error::Daily pipeline failed with a fatal error."
              exit 1
              ;;
            2)
              {
                echo "## Daily pipeline completed with partial failures"
                echo
                echo "> **Warning:** Some sources could not be collected. The daily report may be incomplete."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Daily pipeline returned unexpected exit code $status."
              exit "$status"
              ;;
          esac

      - name: Sync unverified drafts to GitHub Issues
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          uv run tde drafts sync-issues | tee sync.txt
          {
            echo "### Issues"
            echo
            sed 's/^/- /; s/^- - /  - /' sync.txt
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # DEC-058: só interessam notícias do dia; rascunhos com mais de 3 dias são fechados.
      - name: Close stale draft issues
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          uv run tde drafts close-stale --days 3 | tee close.txt
          sed 's/^/- /; s/^- - /  - /' close.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Prune old items
        if: always()
        shell: bash
        run: |
          uv run tde prune --days 60 | tee prune.txt
          sed 's/^/- /' prune.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Save database
        if: always() && hashFiles('data/tde.sqlite3') != ''
        uses: actions/cache/save@v6
        with:
          path: data/tde.sqlite3
          key: tde-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve daily report as workflow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tensdireito-daily-report-${{ github.run_id }}
          path: data/reports/daily/*.txt
          if-no-files-found: warn
          retention-days: 14
